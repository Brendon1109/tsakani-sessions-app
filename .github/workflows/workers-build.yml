name: Workers build

# Builds the Cloudflare Worker on Linux the way Workers Builds will, bundles it
# with a wrangler dry run, and smoke tests it under a local wrangler dev. No
# secrets, no Cloudflare login and no deploy: every value below is a
# placeholder, and the Supabase URL points at a project that does not exist,
# so nothing here can read or write real data.

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  workers-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://tsakanisessions.co.za
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      # Node 22 from .node-version, the version Workers Builds will use, so
      # this also proves npm ci accepts the lock file with npm 10.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build

      - name: Bundle with a wrangler dry run
        run: |
          npx wrangler deploy --dry-run --outdir dist-dryrun 2>&1 | tee dryrun.log
          size=$(grep -o 'Total Upload: .*' dryrun.log | tail -1)
          echo "Bundle, as wrangler reports it: ${size:-not found in the output}"
          echo "### Worker bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "${size:-not found in the wrangler output}" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist-dryrun

      - name: Smoke test under wrangler dev
        run: |
          # A dummy cron secret, so the scheduled run gets past the bearer check
          # and the log shows each job being reached.
          printf 'CRON_SECRET=smoke-only\n' > .dev.vars
          npx wrangler dev --port 8787 --test-scheduled --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8787/faq && break
            sleep 2
          done

          fail=0
          check() { # name, expected status, actual status
            if [ "$2" = "$3" ]; then echo "ok   $1 ($3)"; else echo "FAIL $1: expected $2, got $3"; fail=1; fi
          }
          code() { curl -s -o body.html -w '%{http_code}' "$@"; }

          check "home" 200 "$(code http://127.0.0.1:8787/)"
          check "static page rendered on request" 200 "$(code http://127.0.0.1:8787/faq)"
          check "events" 200 "$(code http://127.0.0.1:8787/events)"
          check "unknown event" 404 "$(code http://127.0.0.1:8787/events/no-such-event)"
          check "bad ticket code" 200 "$(code http://127.0.0.1:8787/ticket/not-a-real-code)"
          grep -q "find that ticket" body.html && echo "ok   friendly ticket not found" || { echo "FAIL ticket page text"; fail=1; }
          check "admin gate" 307 "$(code http://127.0.0.1:8787/admin)"
          check "www to apex" 308 "$(code -H 'Host: www.tsakanisessions.co.za' http://127.0.0.1:8787/shop)"
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Host: www.tsakanisessions.co.za' http://127.0.0.1:8787/shop)
          check "www target" "https://tsakanisessions.co.za/shop" "$loc"
          check "optimised image" 200 "$(code 'http://127.0.0.1:8787/_next/image?url=%2Fimages%2Ftsakani-logo.png&w=128&q=75')"
          check "collect route GET" 405 "$(code http://127.0.0.1:8787/api/e)"
          check "collect route POST" 204 "$(code -X POST -H 'content-type: text/plain' --data '{"event":"smoke"}' http://127.0.0.1:8787/api/e)"
          check "track preflight" 204 "$(code -X OPTIONS http://127.0.0.1:8787/api/track)"
          check "csp header" 1 "$(curl -s -D - -o /dev/null http://127.0.0.1:8787/ | grep -ci '^content-security-policy')"

          # The service worker precaches these with cache.addAll, which rejects
          # the whole install on any redirect, so each must be a plain 200.
          for p in $(sed -n '/PRECACHE_URLS = \[/,/\];/p' public/sw.js | grep -o '"/[^"]*"' | tr -d '"'); do
            check "precache $p" 200 "$(code "http://127.0.0.1:8787$p")"
          done

          # The nightly cron. Both jobs must be reached through the fetch
          # handler. They then fail on the placeholder database, which is the
          # alarm path, so the run is expected to report failure.
          curl -s -o /dev/null "http://127.0.0.1:8787/__scheduled?cron=0+3+*+*+*"
          sleep 3
          grep -q "/api/cron/cleanup-orders answered" wrangler-dev.log && echo "ok   cron reached cleanup-orders" || { echo "FAIL cron did not reach cleanup-orders"; fail=1; }
          grep -q "/api/cron/finalize-events" wrangler-dev.log && echo "ok   cron reached finalize-events" || { echo "FAIL cron did not reach finalize-events"; fail=1; }
          if grep -q "answered 401" wrangler-dev.log; then echo "FAIL cron bearer token was refused"; fail=1; else echo "ok   cron bearer token accepted"; fi

          echo "----- wrangler dev log -----"
          cat wrangler-dev.log
          exit $fail
