name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 here, and the Workers build job runs Node 22 from
      # .node-version, the version Workers Builds uses, so the lock file is
      # proven against both npm 11 and npm 10 on every pull request. CI once
      # sat on Node 20 and that caused two problems: @supabase/* requires
      # Node >= 22 and warned on every run, and npm ci called the lock file
      # out of sync over the optional @emnapi entries. It had been red on
      # every push from 25 July to 25 August 2026 for exactly that.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
